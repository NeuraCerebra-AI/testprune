<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="gt gd">
<title id="gt">Three gates, one command each</title>
<desc id="gd">Before the cleanup, the whole suite was the only option at 24 minutes with 186 failures to read. After it, three gates: a fast gate run after every edit, an explicit file list with zero known failures at 10 seconds; a subsystem gate for one owning boundary, which was not separately measured and so shows no figure; and a broad gate run before a push, everything provider-free, at 10 minutes with 33 classified pre-existing failures. The figures come from one repository measured during the build and are not a benchmark.</desc>
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace}
.rise{animation:rise .6s ease-out both}
.r1{animation-delay:.15s}.r2{animation-delay:.5s}.r3{animation-delay:.75s}.r4{animation-delay:1s}.r5{animation-delay:1.25s}
.flow{stroke-dasharray:6 8;animation:march .75s linear 10 both}
.pip{animation:pip 2.6s ease-in-out 3 both;transform-box:fill-box;transform-origin:center}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes march{to{stroke-dashoffset:-14}}
@keyframes pip{0%,70%{opacity:.35}82%,100%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation-duration:0.01ms !important;animation-iteration-count:1 !important;animation-delay:0s !important}}
</style>
<rect x="8" y="8" width="1184" height="384" rx="16" fill="#0d1117" stroke="#30363d"/>

<text class="sans rise" x="48" y="50" font-size="20" fill="#e6edf3">Three gates, one command each</text>

<g class="rise r1">
<rect x="40" y="68" width="1120" height="46" rx="8" fill="#161b22" stroke="#30363d" stroke-dasharray="5 4"/>
<circle cx="64" cy="91" r="5" fill="#6e7681"/>
<text class="mono" x="82" y="97" font-size="15" fill="#8b949e">Before: the whole suite was the only option. 24 min, 186 failures to read.</text>
</g>

<g class="rise r2">
<rect x="40" y="136" width="340" height="204" rx="10" fill="#161b22" stroke="#238636"/>
<circle class="pip" cx="64" cy="166" r="5" fill="#3fb950"/>
<text class="mono" x="80" y="171" font-size="13" fill="#3fb950">after every edit</text>
<text class="mono" x="64" y="204" font-size="16" fill="#e6edf3">run_test_gates.sh fast</text>
<text class="sans" x="64" y="232" font-size="13.5" fill="#adbac7">Explicit file list, zero known</text>
<text class="sans" x="64" y="252" font-size="13.5" fill="#adbac7">failures.</text>
<text class="mono" x="64" y="304" font-size="32" fill="#3fb950">10 s</text>
<text class="mono" x="64" y="328" font-size="14" fill="#6e7681">measured</text>
</g>

<g class="rise r3">
<rect x="430" y="136" width="340" height="204" rx="10" fill="#161b22" stroke="#30363d"/>
<circle cx="454" cy="166" r="5" fill="#8b949e"/>
<text class="mono" x="470" y="171" font-size="13" fill="#8b949e">after related items land</text>
<text class="mono" x="454" y="204" font-size="16" fill="#e6edf3">run_test_gates.sh subsystem</text>
<text class="sans" x="454" y="232" font-size="13.5" fill="#adbac7">One owning boundary.</text>
<text class="mono" x="454" y="304" font-size="32" fill="#484f58">n/a</text>
<text class="mono" x="454" y="328" font-size="14" fill="#6e7681">not separately measured</text>
</g>

<g class="rise r4">
<rect x="820" y="136" width="340" height="204" rx="10" fill="#161b22" stroke="#30363d"/>
<circle cx="844" cy="166" r="5" fill="#8b949e"/>
<text class="mono" x="860" y="171" font-size="13" fill="#8b949e">before a push</text>
<text class="mono" x="844" y="204" font-size="16" fill="#e6edf3">run_test_gates.sh broad</text>
<text class="sans" x="844" y="232" font-size="13.5" fill="#adbac7">Everything provider-free.</text>
<text class="mono" x="844" y="304" font-size="32" fill="#e6edf3">10 min</text>
<text class="mono" x="844" y="328" font-size="14" fill="#6e7681">33 classified failures</text>
</g>

<path class="flow" d="M380 238 H430" stroke="#58A6FF" stroke-width="2" fill="none"/>
<path class="flow" d="M770 238 H820" stroke="#58A6FF" stroke-width="2" fill="none"/>

<text class="mono rise r5" x="48" y="372" font-size="14" fill="#8b949e">Measured on one repository during the build. One case, not a benchmark.</text>
</svg>
