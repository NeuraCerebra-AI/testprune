<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="ct cd">
<title id="ct">Classification: every test module into exactly one bucket</title>
<desc id="cd">Seven buckets on the left, production coverage, deprecated-path coverage, historical or stale-intent, live paid credentialed, environment-dependent, duplicated and untracked ad hoc, feed into a production authority check in the middle, which routes each module to one of three outcomes on the right: keep, retarget first, or remove recoverably with git rm. A note along the bottom states that a permanently red test whose expectation cannot be corrected with source authority is left red and listed, not quietly removed.</desc>
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace}
.rise{animation:rise .6s ease-out both}
.b1{animation-delay:.1s}.b2{animation-delay:.18s}.b3{animation-delay:.26s}.b4{animation-delay:.34s}
.b5{animation-delay:.42s}.b6{animation-delay:.5s}.b7{animation-delay:.58s}
.gate{animation-delay:.8s}
.o1{animation-delay:1.1s}.o2{animation-delay:1.3s}.o3{animation-delay:1.5s}
.note{animation-delay:1.8s}
.flow{stroke-dasharray:6 8;animation:march .75s linear infinite}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes march{to{stroke-dashoffset:-14}}
@media (prefers-reduced-motion: reduce){*{animation-duration:0.01ms !important;animation-iteration-count:1 !important;animation-delay:0s !important}}
</style>
<rect x="8" y="8" width="1184" height="454" rx="16" fill="#0d1117" stroke="#30363d"/>

<text class="sans rise" x="40" y="52" font-size="20" fill="#e6edf3">Classification: every test module into exactly one bucket</text>
<text class="mono rise b2" x="40" y="76" font-size="13" fill="#6e7681">Classified by what a test proves, not by the vocabulary in its fixtures</text>

<g class="mono" font-size="16" fill="#adbac7">
<rect class="rise b1" x="40" y="106" width="330" height="32" rx="6" fill="#161b22" stroke="#30363d"/><text class="rise b1" x="58" y="128">production coverage</text>
<rect class="rise b2" x="40" y="146" width="330" height="32" rx="6" fill="#161b22" stroke="#30363d"/><text class="rise b2" x="58" y="168">deprecated-path coverage</text>
<rect class="rise b3" x="40" y="186" width="330" height="32" rx="6" fill="#161b22" stroke="#30363d"/><text class="rise b3" x="58" y="208">historical or stale-intent</text>
<rect class="rise b4" x="40" y="226" width="330" height="32" rx="6" fill="#161b22" stroke="#30363d"/><text class="rise b4" x="58" y="248">live, paid, credentialed</text>
<rect class="rise b5" x="40" y="266" width="330" height="32" rx="6" fill="#161b22" stroke="#30363d"/><text class="rise b5" x="58" y="288">environment-dependent</text>
<rect class="rise b6" x="40" y="306" width="330" height="32" rx="6" fill="#161b22" stroke="#30363d"/><text class="rise b6" x="58" y="328">duplicated</text>
<rect class="rise b7" x="40" y="346" width="330" height="32" rx="6" fill="#161b22" stroke="#30363d"/><text class="rise b7" x="58" y="368">untracked ad hoc</text>
</g>

<g stroke="#30363d" stroke-width="1.5" fill="none">
<path d="M370 122 H390"/><path d="M370 162 H390"/><path d="M370 202 H390"/><path d="M370 242 H390"/><path d="M370 282 H390"/><path d="M370 322 H390"/><path d="M370 362 H390"/>
<path d="M390 122 V362"/>
</g>
<path class="flow" d="M390 242 H420" stroke="#58A6FF" stroke-width="2" fill="none"/>

<g class="rise gate">
<rect x="420" y="186" width="180" height="112" rx="10" fill="#161b22" stroke="#484f58"/>
<text class="mono" x="510" y="222" font-size="16" fill="#e6edf3" text-anchor="middle">production</text>
<text class="mono" x="510" y="246" font-size="16" fill="#e6edf3" text-anchor="middle">authority</text>
<text class="mono" x="510" y="274" font-size="13" fill="#6e7681" text-anchor="middle">named by file</text>
</g>

<g fill="none" stroke-width="2">
<path class="flow" d="M600 242 C 626 242 626 150 650 150" stroke="#3fb950"/>
<path class="flow" d="M600 242 H650" stroke="#d29922"/>
<path class="flow" d="M600 242 C 626 242 626 366 650 366" stroke="#6e7681"/>
</g>

<g class="rise o1">
<rect x="650" y="106" width="500" height="88" rx="10" fill="#161b22" stroke="#238636"/>
<text class="mono" x="672" y="134" font-size="16" fill="#3fb950">keep</text>
<text class="sans" x="672" y="158" font-size="13.5" fill="#adbac7">Production coverage certifies the change. Tests over retired-format</text>
<text class="sans" x="672" y="178" font-size="13.5" fill="#adbac7">rows that prove readability, refusal or migration stay.</text>
</g>
<g class="rise o2">
<rect x="650" y="214" width="500" height="88" rx="10" fill="#161b22" stroke="#9e6a03"/>
<text class="mono" x="672" y="242" font-size="16" fill="#d29922">retarget first</text>
<text class="sans" x="672" y="266" font-size="13.5" fill="#adbac7">A real invariant gets one focused test against the production</text>
<text class="sans" x="672" y="286" font-size="13.5" fill="#adbac7">path before the test carrying it is removed.</text>
</g>
<g class="rise o3">
<rect x="650" y="322" width="500" height="88" rx="10" fill="#161b22" stroke="#484f58"/>
<text class="mono" x="672" y="350" font-size="16" fill="#8b949e">remove, recoverable</text>
<text class="sans" x="672" y="374" font-size="13.5" fill="#adbac7">Tracked files go with git rm and the recovery hash lands in the</text>
<text class="sans" x="672" y="394" font-size="13.5" fill="#adbac7">ledger. Untracked files move to a gitignored archive.</text>
</g>

<g class="rise note">
<rect x="40" y="420" width="1110" height="32" rx="8" fill="#161b22" stroke="#30363d"/>
<circle cx="62" cy="436" r="5" fill="#d29922"/>
<text class="mono" x="80" y="441" font-size="13" fill="#8b949e">A permanently red test whose expectation cannot be corrected with source authority is left red and listed, not quietly removed.</text>
</g>
</svg>
