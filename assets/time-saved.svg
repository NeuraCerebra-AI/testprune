<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="st sd">
<title id="st">How long you wait between an edit and its test result</title>
<desc id="sd">Three figures measured on one repository: the routine check an agent runs after every edit dropped from 41.90 seconds to 2.72 seconds; feedback is 15.4 times faster, a 93.5 percent cut; and ten edit and test cycles give back 6 minutes 32 seconds of waiting. Below them, two bars drawn to the same scale compare ten cycles before, at 6 minutes 59 seconds, against ten cycles after, at 27.2 seconds. The figures come from one repository measured before and after, not a benchmark.</desc>
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace}
.rise{animation:rise .6s ease-out both}
.t1{animation-delay:.15s}.t2{animation-delay:.3s}.t3{animation-delay:.45s}.t4{animation-delay:.7s}.t5{animation-delay:1.1s}
.barB{animation:growB 1s cubic-bezier(.2,.7,.3,1) .7s both}
.barA{animation:growA .8s cubic-bezier(.2,.7,.3,1) 1.15s both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes growB{from{width:0px}to{width:900px}}
@keyframes growA{from{width:0px}to{width:58px}}
@media (prefers-reduced-motion: reduce){*{animation-duration:0.01ms !important;animation-iteration-count:1 !important;animation-delay:0s !important}}
</style>
<rect x="8" y="8" width="1184" height="364" rx="16" fill="#0d1117" stroke="#30363d"/>

<text class="sans rise" x="40" y="50" font-size="20" fill="#e6edf3">How long you wait between an edit and its test result</text>

<g class="rise t1">
<rect x="40" y="74" width="360" height="100" rx="10" fill="#161b22" stroke="#238636"/>
<text class="mono" x="62" y="100" font-size="13" fill="#8b949e">Routine check after an edit</text>
<text class="mono" x="62" y="140" font-size="34" fill="#3fb950">2.72 s</text>
<text class="mono" x="62" y="162" font-size="13" fill="#6e7681">was 41.90 s</text>
</g>
<g class="rise t2">
<rect x="420" y="74" width="360" height="100" rx="10" fill="#161b22" stroke="#30363d"/>
<text class="mono" x="442" y="100" font-size="13" fill="#8b949e">Feedback latency</text>
<text class="mono" x="442" y="140" font-size="34" fill="#e6edf3">15.4x</text>
<text class="mono" x="442" y="162" font-size="13" fill="#6e7681">faster, a 93.5% cut</text>
</g>
<g class="rise t3">
<rect x="800" y="74" width="360" height="100" rx="10" fill="#161b22" stroke="#30363d"/>
<text class="mono" x="822" y="100" font-size="13" fill="#8b949e">Ten edit and test cycles</text>
<text class="mono" x="822" y="140" font-size="34" fill="#e6edf3">6m 32s</text>
<text class="mono" x="822" y="162" font-size="13" fill="#6e7681">of waiting removed</text>
</g>

<text class="mono rise t4" x="40" y="230" font-size="16" fill="#8b949e">Before</text>
<rect class="barB" x="200" y="208" width="900" height="30" rx="4" fill="#7d8590"/>
<text class="mono rise t4" x="220" y="229" font-size="16" fill="#0d1117">6m 59s</text>

<text class="mono rise t5" x="40" y="262" font-size="16" fill="#8b949e">After</text>
<rect class="barA" x="200" y="240" width="58" height="30" rx="4" fill="#3fb950"/>
<text class="mono rise t5" x="272" y="261" font-size="16" fill="#3fb950">27.2 s</text>

<g class="mono rise t5" font-size="13" fill="#8b949e">
<rect x="40" y="296" width="12" height="12" rx="3" fill="#7d8590"/><text x="60" y="306">Before, the whole routine check</text>
<rect x="310" y="296" width="12" height="12" rx="3" fill="#3fb950"/><text x="330" y="306">After, the fast gate</text>
<text x="40" y="336" font-size="13" fill="#8b949e">Ten edit and test cycles, both bars drawn to the same scale.</text>
<text x="40" y="358" font-size="13" fill="#6e7681">Measured on one repository before and after. One case, not a benchmark; your suite's numbers will differ.</text>
</g>
</svg>
