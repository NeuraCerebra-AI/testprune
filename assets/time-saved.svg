<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="st sd">
<title id="st">What the optimization pass changed</title>
<desc id="sd">Three figures measured on one repository: the routine check an agent runs after every edit dropped from 24 minutes to 10 seconds, which is 144 times faster, and the failures an agent has to read dropped from 186 to zero. Below them, two bars drawn to the same scale show that the whole suite still runs before a push, in 10 minutes instead of 24. Nothing was thinned to reach those numbers: two 70-second tests became 4 seconds with every assertion intact.</desc>
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace}
.rise{animation:rise .6s ease-out both}
.t1{animation-delay:.15s}.t2{animation-delay:.3s}.t3{animation-delay:.45s}.t4{animation-delay:.7s}.t5{animation-delay:1.1s}
.barB{animation:growB 1s cubic-bezier(.2,.7,.3,1) .7s both}
.barA{animation:growA .9s cubic-bezier(.2,.7,.3,1) 1.15s both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes growB{from{width:0px}to{width:900px}}
@keyframes growA{from{width:0px}to{width:375px}}
@media (prefers-reduced-motion: reduce){*{animation-duration:0.01ms !important;animation-iteration-count:1 !important;animation-delay:0s !important}}
</style>
<rect x="8" y="8" width="1184" height="384" rx="16" fill="#0d1117" stroke="#30363d"/>

<text class="sans rise" x="40" y="50" font-size="20" fill="#e6edf3">What the optimization pass changed</text>

<g class="rise t1">
<rect x="40" y="74" width="360" height="100" rx="10" fill="#161b22" stroke="#238636"/>
<text class="mono" x="62" y="100" font-size="13" fill="#8b949e">Routine check after an edit</text>
<text class="mono" x="62" y="140" font-size="34" fill="#3fb950">10 s</text>
<text class="mono" x="62" y="162" font-size="13" fill="#6e7681">was 24 min</text>
</g>
<g class="rise t2">
<rect x="420" y="74" width="360" height="100" rx="10" fill="#161b22" stroke="#30363d"/>
<text class="mono" x="442" y="100" font-size="13" fill="#8b949e">Feedback latency</text>
<text class="mono" x="442" y="140" font-size="34" fill="#e6edf3">144x</text>
<text class="mono" x="442" y="162" font-size="13" fill="#6e7681">faster</text>
</g>
<g class="rise t3">
<rect x="800" y="74" width="360" height="100" rx="10" fill="#161b22" stroke="#30363d"/>
<text class="mono" x="822" y="100" font-size="13" fill="#8b949e">Failures an agent must read</text>
<text class="mono" x="822" y="140" font-size="34" fill="#e6edf3">0</text>
<text class="mono" x="822" y="162" font-size="13" fill="#6e7681">was 186</text>
</g>

<text class="mono rise t4" x="40" y="216" font-size="14" fill="#8b949e">The whole suite still runs before a push</text>
<text class="mono rise t4" x="40" y="252" font-size="16" fill="#8b949e">before</text>
<rect class="barB" x="200" y="234" width="900" height="26" rx="4" fill="#7d8590"/>
<text class="mono rise t4" x="218" y="252" font-size="16" fill="#0d1117">24 min</text>
<text class="mono rise t5" x="40" y="290" font-size="16" fill="#8b949e">after</text>
<rect class="barA" x="200" y="272" width="375" height="26" rx="4" fill="#3fb950"/>
<text class="mono rise t5" x="218" y="290" font-size="16" fill="#0d1117">10 min</text>

<g class="mono rise t5" font-size="13">
<text x="40" y="334" fill="#8b949e">Nothing was thinned to get there. Two 70-second tests became 4 seconds with every assertion intact.</text>
<text x="40" y="360" fill="#6e7681">Measured on one repository before and after. One case, not a benchmark; your suite's numbers will differ.</text>
</g>
</svg>
